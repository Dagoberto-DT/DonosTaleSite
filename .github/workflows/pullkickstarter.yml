name: Pull Kickstarter Stuff

on:
  schedule:
    - cron: "*/30 * * * *"  # Every 30 minutes
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Fetch and parse json
        run: |
          curl -s https://www.kickstarter.com/projects/superitemstudios/donos-tale-relaunch.json -o data.json

          pledged=$(jq '.project.pledged' data.json)
          goal=$(jq '.project.goal' data.json)
          deadline=$(jq -r '.project.deadline' data.json)

          pledged_dollars=$(awk "BEGIN { printf \"%.0f\", $pledged / 100 }")
          goal_dollars=$(awk "BEGIN { printf \"%.0f\", $goal / 100 }")
          percent=$(awk "BEGIN { printf \"%.2f\", ($pledged / $goal) * 100 }")

          end_time=$(date -u -d @"$deadline" +%Y-%m-%dT%H:%M:%SZ)

          echo "{
            \"pledged\": $pledged_dollars,
            \"percent\": $percent,
            \"goal\": $goal_dollars,
            \"end_time\": \"$end_time\",
            \"updated\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
          }" > kickstarter.json

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          if git diff --quiet; then
            echo "No changes to commit."
          else
            git add kickstarter.json
            git commit -m "Update Kickstarter data [auto]"
            git push
          fi
